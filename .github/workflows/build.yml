name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Paper-API-Version fuer 26.3 ermitteln
        id: v
        run: |
          set -e
          meta() { curl -fsSL "$1/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | sed -e 's/<[^>]*>//g'; }
          PAPER=$(meta https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api | grep '^26\.3' | grep -viE 'snapshot|pre|rc' | tail -1 || true)
          if [ -z "$PAPER" ]; then PAPER=$(meta https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api | grep '^26\.3' | tail -1); fi
          echo "Paper API: $PAPER"
          echo "paper=$PAPER" >> "$GITHUB_OUTPUT"

      - name: Plugin bauen
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace -PpaperVersion="${{ steps.v.outputs.paper }}" 2>&1 | tee build.log

      - name: Build-Log in Branch ci-logs ablegen
        if: always()
        run: |
          mkdir -p /tmp/logs
          cp -f build.log /tmp/logs/ 2>/dev/null || true
          echo "paper=${{ steps.v.outputs.paper }} sha=${{ github.sha }}" > /tmp/logs/info.txt
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Logs ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: spawnelytra
          path: build/libs/SpawnElytra.jar

      - name: Release "latest" aktualisieren
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SpawnElytra (neuester Build)
          prerelease: true
          make_latest: false
          body: |
            Automatischer Build von ${{ github.sha }} · Paper-API ${{ steps.v.outputs.paper }}

            SpawnElytra.jar → in den plugins-Ordner des Servers
          files: build/libs/SpawnElytra.jar
